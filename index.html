            </div>
          </div>
          <!-- elements -->
          <div class="info">
              <p>Unlitle</p>
          </div>
          <!-- layer container -->
              <div class="layers">
                <p>Layers</p>
                <div class="innerLayers">
                    <!-- <span>frame 1</span> -->
                    <!-- <span>frame 2</span> -->
                </div>
              </div>
        </div>
        <!-- toobar -->
        <div class="toolbar">
          <div class="tools">
            <i class="ri-artboard-2-line" id="frame"></i>
            <i class="ri-rectangle-line" id="rect"></i>
            <i class="ri-text" id="text"></i>
            <div class="align-text">
              <button onclick="alignLeft()"><i class="ri-align-left left" ></i></button>
              <button onclick="aligneCenter()"><i class="ri-align-center center"></i></button>
              <button onclick="alignRight()"><i class="ri-align-right right"></i></button>
            </div>
            <!-- <div class="color"> -->
              <i class="ri-sip-line color">
                <div class="palette">
                  <!-- Reds / Oranges -->
                  <button data-color="#FF3B30"></button>
                  <button data-color="#FF9500"></button>
                  <button data-color="#FFCC00"></button>

                  <!-- Greens -->
                <button data-color="#34C759"></button>
                <button data-color="#00C853"></button>

                <!-- Blues -->
                <button data-color="#007AFF"></button>
                <button data-color="#5856D6"></button>
                <button data-color="#5AC8FA"></button>

                <!-- Pinks / Purples -->
                <button data-color="#AF52DE"></button>
                <button data-color="#FF2D55"></button>

                <!-- Neutrals -->
                <button data-color="#000000"></button>
                <button data-color="#8E8E93"></button>
                <button data-color="#FFFFFF"></button>
             </div>
            </i>

            <!-- </div> -->
            <i class="ri-font-size" id="font-size"><input id="fontsize" type="number" value="16" min="8" max="120" ></i>
          </div>
          <div class="aligments">
            
          </div>
        </div>
        <!-- canvas area -->
        <div class="canvasarea">
        </div>
